<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Pessoas | Cinepop</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/app.css">
</head>

<body class="pagina-app">
    <a class="pular" href="#principal">Pular para o conteúdo</a>
    <header class="cabecalho" id="cabecalho"></header>
    <main class="container" id="principal">
        <p id="status" class="status" role="status" aria-live="polite"></p>
        <section class="hero-app"><span class="eyebrow">CINEMA É CONVERSA</span>
            <h1>Encontre sua comunidade.</h1>
            <p>Descubra pessoas e acompanhe seus perfis.</p>
            <form id="form-pessoas" class="pesquisa"><label for="busca-pessoas">Buscar por nome de usuário</label>
                <div class="barra-pesquisa"><input id="busca-pessoas" type="search" maxlength="30"
                        placeholder="Nome de usuário, sem @"><button>Buscar</button></div>
                <div class="campo filtro"><label for="filtro-pessoas">Mostrar</label><select id="filtro-pessoas">
                        <option value="todos">Todos os perfis públicos</option>
                        <option value="seguindo">Quem eu sigo</option>
                        <option value="seguidores">Meus seguidores</option>
                    </select></div>
            </form>
        </section>
        <div id="pessoas" class="pilha"></div>
        <div class="paginacao"><button id="pessoas-anteriores" class="btn-secundario" disabled>Anterior</button><button
                id="proximas-pessoas" class="btn-secundario" disabled>Próxima</button></div>
    </main>
    <footer class="rodape">Cinepop · Seu próximo favorito está por aqui.<br><a href="https://www.themoviedb.org/"
            target="_blank" rel="noopener noreferrer">Dados e imagens: TMDB</a><small>This product uses the TMDB API but
            is not endorsed or certified by TMDB.</small></footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="js/supabase.js" defer></script>
    <script src="js/app.js" defer></script>
    <script src="js/amigos.js" defer></script>
</body>

</html>
